<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#355a48"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<rect x="210" y="20" width="340" height="75" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
