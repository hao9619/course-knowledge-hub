<text x="380.0" y="76" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">新资料先保存为草稿</text>
<path d="M380,95 V135" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="210" y="135" width="340" height="75" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">校验文件</text>
<text x="380.0" y="191" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">格式、大小、文件特征</text>
<path d="M380,210 V260" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M380.0,260 L530,305.0 L380.0,350 L230,305.0 Z" fill="#fff8e8" stroke="#8c7950" stroke-width="1.7"/>
<text x="380.0" y="312.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">校验、解析是否成功？</text>
<path d="M380,350 V400" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="403" y="380" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">是</text>
<rect x="210" y="400" width="340" height="90" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="429" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">再次校验会话和资料版本</text>
<text x="380.0" y="456" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">身份有效，且解析期间未被修改</text>
<path d="M530,305 H700 V703 H500" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="625" y="286" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">否：返回错误</text>
<rect x="210" y="540" width="340" height="100" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="569" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">事务保存附件、重建索引</text>
<text x="380.0" y="596" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">失败保留草稿和待上传文件</text>
<text x="380.0" y="621" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">成功按所选状态发布</text>
<path d="M380,490 V540" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
