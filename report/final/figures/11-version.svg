<text x="122.5" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">读取第 n 版</text>
<rect x="280" y="30" width="200" height="85" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="59" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">数据库</text>
<text x="380.0" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">资料、标签和索引</text>
<rect x="535" y="30" width="205" height="85" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="637.5" y="59" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">编辑者 B</text>
<text x="637.5" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">同样读取第 n 版</text>
<path d="M122,115 V185 H280" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="163" y="163" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">A 提交 n</text>
<rect x="280" y="150" width="200" height="105" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="179" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">检查并写入</text>
<text x="380.0" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">版本匹配，事务提交</text>
<text x="380.0" y="231" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">版本变为 n + 1</text>
<path d="M637,115 V310 H480" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="620" y="286" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">B 仍提交 n</text>
<rect x="280" y="290" width="200" height="105" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="319" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">发现版本不匹配</text>
<text x="380.0" y="346" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">返回 409</text>
<text x="380.0" y="371" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="400" fill="#263f33">不覆盖现有内容</text>
<path d="M380,395 V450" stroke="#355a48" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="180" y="450" width="400" height="55" rx="8" stroke="#537d65" stroke-width="1.7" fill="#f2f7f1"/>
<text x="380.0" y="479" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17.594791666666666" font-weight="700" fill="#263f33">B 重新打开资料，确认新内容后再编辑</text>
</svg>